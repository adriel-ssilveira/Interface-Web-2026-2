<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Prova on-line sobre JavaScript e Web Components.">
    <title>Interação Web | Prova on-line</title>
    <link rel="stylesheet" href="css/reset.css">
    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .quiz-page { min-height: calc(100vh - 150px); padding: clamp(2rem, 5vw, 4rem) 0; }
        .quiz-intro { max-width: 760px; margin: 0 auto 2rem; text-align: center; }
        .quiz-intro .eyebrow { color: var(--color-primary); }
        .quiz-intro h1 { margin: .6rem 0 .8rem; font-size: clamp(2rem, 5vw, 3.2rem); line-height: 1.1; letter-spacing: -.04em; }
        .quiz-intro p:last-child { max-width: 620px; margin: 0 auto; color: var(--color-muted); line-height: 1.7; }
        my-test { display: block; max-width: 880px; margin: 0 auto; }
    </style>
</head>
<body>
    <site-header active="quiz"><span slot="subtitle">Portfólio da disciplina</span></site-header>
    <main class="quiz-page">
        <div class="container">
            <section class="quiz-intro" aria-labelledby="page-title">
                <span class="eyebrow">TRABALHO 2 · JAVASCRIPT</span>
                <h1 id="page-title">Teste seus conhecimentos</h1>
                <p>Responda às questões sobre objetos literais, Custom Elements, Shadow DOM e slots. Ao finalizar, você verá sua nota, suas respostas e o gabarito.</p>
            </section>
            <my-test></my-test>
        </div>
    </main>
    <site-footer></site-footer>
    <script src="js/components.js"></script>
    <script src="js/quiz.js"></script>
</body>
</html>
